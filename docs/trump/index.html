  <body>
    カスタムの場合 in code
    <!--
    3.0.3
  -->
    cdn

    <div id="pyxel-screen"></div>

    <pyxel-run gamepad="enabled"
  script="
import pyxel

count = 7

def update():
  global count
  if pyxel.btnp(pyxel.MOUSE_BUTTON_LEFT):
    count += 1
    # pre, tr, style(ある意味チャンネル数), seed
    pyxel.gen_bgm(count % 8, 0, 1, 2, play=True)

def draw():
  global count
  pyxel.cls(15)
  pyxel.line(pyxel.frame_count % 100, 20, 180, 130, 7)
  pyxel.text(16, 16, f'{count % 8} {pyxel.frame_count}', 8)

pyxel.init(200, 150)
pyxel.run(update, draw)
"
></pyxel-run>
